<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="kettlebellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Kettlebell Handle -->
  <path d="M 12 6 L 20 6 A 2 2 0 0 1 22 8 L 22 10 A 2 2 0 0 1 20 12 L 12 12 A 2 2 0 0 1 10 10 L 10 8 A 2 2 0 0 1 12 6 Z" 
        fill="url(#kettlebellGradient)" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="0.5"/>
  
  <!-- Kettlebell Body -->
  <circle cx="16" cy="20" r="10" 
          fill="url(#kettlebellGradient)" 
          stroke="rgba(255,255,255,0.2)" 
          stroke-width="0.5"/>
  
  <!-- Inner highlight -->
  <circle cx="14" cy="17" r="3" 
          fill="rgba(255,255,255,0.2)" 
          opacity="0.6"/>
  
  <!-- Weight marking -->
  <text x="16" y="22" 
        font-family="Arial, sans-serif" 
        font-size="6" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="white" 
        opacity="0.8">KB</text>
</svg>